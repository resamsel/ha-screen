name: Release

# Pushing a tag vMAJOR.MINOR.PATCH (e.g. v1.2.0) builds the firmware with the tag as its version
# and publishes a GitHub release. The boards' "Update" button (config panel, Firmware page)
# installs the latest release's ha-screen.bin and mdi_icons.bin (issue #14).
# Tags with a suffix (v1.2.0-rc.1) become pre-releases, which "latest" - and so the boards - skip.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag
        shell: bash
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-suffix]"; exit 1
          fi
          # esp_app_desc_t.version holds 31 characters
          if [ ${#GITHUB_REF_NAME} -gt 31 ]; then echo "::error::tag longer than 31 characters"; exit 1; fi
      - name: Build
        shell: bash
        env:   # never bake build-time Wi-Fi/HA defaults (main/gen_secrets.cmake) into a release
          WIFI_SSID: ""
          WIFI_PASS: ""
          HA_TOKEN: ""
        run: |
          . $IDF_PATH/export.sh
          echo "$GITHUB_REF_NAME" > version.txt   # the app version the board shows and compares
          idf.py build
          mkdir dist
          cp build/lvgl_example.bin dist/ha-screen.bin
          cp build/bootloader/bootloader.bin build/partition_table/partition-table.bin \
             build/ota_data_initial.bin main/mdi_icons.bin dist/
          # one image for the first USB flash (or a recovery): write it at 0x0
          (cd build && python -m esptool --chip esp32c6 merge_bin -o ../dist/ha-screen-full.bin "@flash_args")
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
