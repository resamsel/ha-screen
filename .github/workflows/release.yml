name: Release

# A v* tag builds the firmware and publishes it as a GitHub release. The boards' "Update"
# button (config panel, Firmware page) installs the latest release's ha-screen.bin (issue #14).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          echo "${GITHUB_REF_NAME}" > version.txt   # the app version the board shows and compares
          idf.py build
          mkdir dist
          cp build/lvgl_example.bin dist/ha-screen.bin
          cp build/bootloader/bootloader.bin build/partition_table/partition-table.bin build/ota_data_initial.bin main/mdi_icons.bin dist/
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
