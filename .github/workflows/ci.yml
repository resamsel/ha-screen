name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Host tests
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        shell: bash
        run: sh test/run.sh

  build:
    name: Firmware build
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, so the version is "v1.2.0-3-gabc1234" (git describe)
      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . $IDF_PATH/export.sh
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/lvgl_example.bin
            build/partition_table/partition-table.bin
            build/bootloader/bootloader.bin
            build/ota_data_initial.bin
            main/mdi_icons.bin
