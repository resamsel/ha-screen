name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Host tests
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        shell: bash
        run: sh test/run.sh

  build:
    name: Firmware build
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    env:
      # placeholders: the build only needs the values to exist (see main/gen_secrets.cmake)
      WIFI_SSID: ci
      WIFI_PASS: ci
      HA_TOKEN: ci
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/lvgl_example.bin
            build/partition_table/partition-table.bin
            build/bootloader/bootloader.bin
